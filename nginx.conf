server {
    listen 80;
    server_name your_domain_or_ip;  # Replace with your domain or Lightsail IP

    location = /favicon.ico { access_log off; log_not_found off; }
    location /static/ {
        root /app;
    }

    location / {
        include proxy_params;
        proxy_pass http://web:8000;
    }
}